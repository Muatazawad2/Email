  </g>
  <rect x="40" y="30" width="820" height="340" rx="12" fill="none" stroke="#C8C6C4"/>
  <rect x="72" y="56" width="92" height="26" rx="13" fill="#CA5010"/>
  <text x="118" y="74" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Medium</text>
  <text x="178" y="74" font-size="12.5" fill="#605E5C">New alert  ·  Custom detection  ·  Continuous (NRT)</text>
